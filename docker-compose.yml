version: '3.8'

services:
  claw-mcp-server:
    build: ./backend
    container_name: claw-mcp-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      # 将宿主机的 backend 目录映射到容器，方便开发热更
      - ./backend:/app
      # 将宿主机的 data/workspace 目录映射到容器的 /app/workspace
      - ./data/workspace:/app/workspace
    environment:
      - TZ=Asia/Shanghai
      # 配置生成的下载链接的主机地址。如果是其他容器访问，可用 host.docker.internal；如果直接在宿主机浏览器点开，可改为 http://127.0.0.1:9080
      - DOWNLOAD_BASE_URL=http://host.docker.internal:9080

  # 新增一个轻量级的文件服务器，用来给 Openclaw 提供真实的下载链接
  file-server:
    image: nginx:alpine
    container_name: claw-file-server
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./data/workspace:/usr/share/nginx/html:ro
    environment:
      - TZ=Asia/Shanghai
