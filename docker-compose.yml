services:
  claw-mcp-server:
    build: ./backend
    container_name: claw-mcp-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      # 将宿主机的 backend 目录映射到容器，方便开发热更
      - ./backend:/app
      # 将宿主机的 data/workspace 目录映射到容器的 /app/workspace
      - ./data/workspace:/app/workspace
    environment:
      - TZ=Asia/Shanghai
      # 配置生成的下载链接的主机地址。由于合并到了网关 nginx (80端口)，地址改为 /claw_workspace
      - DOWNLOAD_BASE_URL=http://host.docker.internal/claw_workspace
      # 数据库连接配置 (供 calendar_todo.py 使用)
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Gmcc@123
      - DB_NAME=openclaw_mcp
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - web
